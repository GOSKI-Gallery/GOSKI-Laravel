name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: CARTO_API_KEY
          script: |
            set -e
            # Fail-fast: sem a key o docker compose sobe com env vazia e o mapa exibe "API KEY REQUIRED"
            if [ -z "${CARTO_API_KEY:-}" ]; then
              echo "✗ CARTO_API_KEY vazia — verifique o secret CARTO_API_KEY no GitHub"
              exit 1
            fi
            echo "✓ CARTO_API_KEY presente (${#CARTO_API_KEY} chars)"
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH="/var/www/html/GOSKI-Laravel"; fi
            cd "$DEPLOY_PATH"
            git pull origin main
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.override.yml"
            $COMPOSE build
            # --no-build: build já feito acima; garante que up use a imagem recém-construída
            # app primeiro para evitar race no volume app_build; nginx depende de app saudável
            $COMPOSE up -d --no-build app
            $COMPOSE up -d --no-build --remove-orphans nginx worker
            echo "→ Aguardando serviços..."
            sleep 10
            $COMPOSE ps
            for i in $(seq 1 12); do
              if $COMPOSE exec -T nginx wget --no-verbose --tries=1 --spider http://127.0.0.1/up 2>/dev/null; then
                echo "✓ App respondendo em /up"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "✗ App não respondeu em /up após 60s — logs:"
                $COMPOSE logs --tail=100 app nginx
                exit 1
              fi
              sleep 5
            done
            docker system prune -f