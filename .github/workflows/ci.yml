name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: goski_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, tokenizer, xml, curl, bcmath, pdo_mysql
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Setup environment file
        run: |
          cp .env.example .env
          echo "SUPABASE_URL=https://test.supabase.co" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=test_service_role_key" >> .env
          echo "SUPABASE_ANON_KEY=test_anon_key" >> .env
          php artisan key:generate

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Static analysis
        run: |
          vendor/bin/phpstan analyse -c phpstan.neon --no-progress
          vendor/bin/pint --test

      - name: Unit & Feature tests with coverage
        env:
          DB_CONNECTION: mysql
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: goski_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: |
          vendor/bin/phpunit --testsuite=Unit,Feature --coverage-clover=coverage.xml

      - name: Check minimum coverage
        run: |
          php -r "
            \$xml = simplexml_load_file('coverage.xml');
            if (\$xml === false) { echo 'Failed to parse coverage.xml' . PHP_EOL; exit(1); }
            \$metrics = \$xml->project->metrics;
            \$covered = (int) \$metrics['coveredstatements'];
            \$total = (int) \$metrics['statements'];
            \$percent = \$total > 0 ? round(\$covered / \$total * 100, 2) : 0;
            echo 'Coverage: ' . \$percent . '%' . PHP_EOL;
            \$minimum = 20;
            if (\$percent < \$minimum) {
              echo 'FAIL: Coverage ' . \$percent . '% is below minimum ' . \$minimum . '%' . PHP_EOL;
              exit(1);
            }
            echo 'PASS: Coverage meets minimum threshold.' . PHP_EOL;
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

      # End‑to‑End tests (Dusk) – will be added after installing laravel/dusk
